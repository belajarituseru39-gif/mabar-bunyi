        // Sound Effects (Web Audio API)
        let audioCtx = null;
        const playSfx = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return; 
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                if (type === 'correct') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'incorrect') {
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2); 
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'click') {
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime); 
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05); 
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.05);
                }
            } catch (err) { console.warn("Efek suara tidak didukung.", err); }
        };

        function Level2CheckSound({ onComplete, onCorrect }) {
            const data = LEVEL_DATA[2];
            const [answers, setAnswers] = useState({});
            const [step, setStep] = useState('quiz'); 
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [scoreDetails, setScoreDetails] = useState(0);

            const flatQuestions = React.useMemo(() => {
                const arr = [];
                data.parts.forEach(part => {
                    part.questions.forEach(q => {
                        const originalOptions = [...q.options];
                        const shuffledOptions = shuffleArray(originalOptions);
                        let newCorrect;
                        if (q.type === 'single') newCorrect = shuffledOptions.indexOf(originalOptions[q.correct]);
                        else newCorrect = q.correct.map(idx => shuffledOptions.indexOf(originalOptions[idx]));

                        arr.push({ ...q, options: shuffledOptions, correct: newCorrect, stimulusTitle: q.stimulusTitle || '', stimulusText: q.stimulusText || '' });
                    });
                });
                return arr;
            }, [data]);

            const currentQ = flatQuestions[currentQIndex];

            const handleSingle = (qId, optIdx) => { setAnswers(prev => ({ ...prev, [qId]: optIdx })); };

            const isCurrentAnswered = answers[currentQ.id] !== undefined;
            const handleNext = () => { if (currentQIndex < flatQuestions.length - 1) setCurrentQIndex(prev => prev + 1); };
            const handlePrev = () => { if (currentQIndex > 0) setCurrentQIndex(prev => prev - 1); };

            const handleSubmit = () => {

                                                <select value={answers[c.id]?.eval !== undefined ? answers[c.id].eval : ""} onChange={e => handleEval(c.id, e.target.value)} className="w-full p-3 rounded-xl border border-cyan-500/30 bg-blue-950/20 outline-none text-blue-100 text-sm transition-all appearance-none cursor-pointer">
                                                    <option value="" disabled>-- Pilih Diagnosis --</option>
                                                    {c.evalOptions.map((opt, idx) => <option key={idx} value={idx}>{opt}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex flex-col">
                                                <label className="text-xs md:text-sm font-bold text-indigo-300 mb-2 uppercase tracking-widest">Resep Fakta Sains:</label>
                                                <select value={answers[c.id]?.create !== undefined ? answers[c.id].create : ""} onChange={e => handleCreate(c.id, e.target.value)} className="w-full p-3 rounded-xl border border-indigo-500/30 bg-indigo-950/20 outline-none text-blue-100 text-sm transition-all appearance-none cursor-pointer">
                                                    <option value="" disabled>-- Pilih Perbaikan Fakta --</option>
                                                    {c.createOptions.map((opt, idx) => <option key={idx} value={idx}>{opt}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="mt-4 pt-4 border-t border-slate-700 text-center flex-shrink-0 flex flex-col items-center">
                                {feedbackMsg && <p className="text-rose-300 font-bold text-sm mb-3 bg-rose-950/50 p-3 rounded-xl border border-rose-500/40 w-full">{feedbackMsg}</p>}
                                <button onClick={handleCheckAnswer} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)] transition-all text-sm md:text-base uppercase tracking-widest font-concert">
                                    Verifikasi Audio
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-slate-900/90 backdrop-blur-xl p-10 rounded-[3rem] shadow-[0_0_40px_rgba(59,130,246,0.3)] text-center space-y-6 border border-blue-500/40 max-w-4xl mx-auto animate-fade-in mt-12">
                            <div className="text-6xl mb-4">{scoreLocal === data.cases.length ? '✨' : '👍'}</div>
                            <h3 className="text-2xl md:text-4xl font-concert font-black text-cyan-300 uppercase tracking-widest text-glow">Audio Jernih!</h3>
                            <p className="text-base md:text-xl font-medium text-indigo-200">Kamu mengoreksi <span className="text-cyan-400 font-black text-2xl mx-1">{scoreLocal}</span> dari {data.cases.length} laporan mixing dengan tepat.</p>
                            <button onClick={onComplete} className="bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-3 px-8 rounded-full mt-4 font-concert tracking-widest">Menuju Panggung 🚀</button>
                        </div>
                    )}
                </div>
            );
        }

        function Level5Panggung({ onComplete, saveRef, saveData }) {
            const data = LEVEL_DATA[5];
            const [rating, setRating] = useState(0);
            const [a1, setA1] = useState("");
            const [a2, setA2] = useState("");
            const [feedbackMsg, setFeedbackMsg] = useState("");

            const handleFinish = () => {
                if (rating === 0 || !a1.trim() || !a2.trim()) { setFeedbackMsg("Sistem menolak! Isi semua entri jurnal sebelum penampilan."); return; }
                playSfx('correct');
                saveData('final_project', { rating, pemahaman: a1, aksi: a2 });
                saveRef(a2);
                onComplete();
            };

            return (
                <div className="flex flex-col h-full w-full max-w-4xl mx-auto flex-1 min-h-0 pb-4 animate-fade-in justify-center">
                    <div className="bg-slate-900/90 backdrop-blur-xl p-6 md:p-10 rounded-[2rem] shadow-[0_0_50px_rgba(59,130,246,0.3)] border border-indigo-500/50 w-full flex flex-col flex-1 min-h-0 mt-5 overflow-hidden">
                        
                        <div className="text-center border-b border-indigo-500/30 pb-5 mb-5 flex-shrink-0">
                            <h3 className="text-2xl md:text-4xl font-concert font-black text-cyan-400 uppercase tracking-widest mb-1 text-glow">{data.title}</h3>
                            <p className="text-sm md:text-base font-bold text-cyan-200/70 uppercase tracking-widest">{data.subtitle}</p>
                        </div>

                        <div className="flex-grow overflow-y-auto custom-scrollbar pr-2 space-y-6 pb-4">
                            <div className="bg-indigo-950/40 p-5 rounded-2xl border border-indigo-500/30">
                                <label className="block text-sm md:text-base font-bold text-cyan-300 mb-3">{data.questions.q1}</label>
                                <div className="flex gap-3 mb-4">
                                    {[1, 2, 3, 4, 5].map(star => (
                                        <Icons.Star key={star} onClick={() => { setRating(star); playSfx('click'); }} className={`w-10 h-10 cursor-pointer transition-transform hover:scale-110 ${rating >= star ? 'text-cyan-400 fill-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]' : 'text-slate-700 fill-slate-800'}`} />
                                    ))}
                                </div>
                            </div>

                            <div className="bg-blue-950/40 p-5 rounded-2xl border border-blue-500/30">
                                <label className="block text-sm md:text-base font-bold text-indigo-300 mb-3">{data.questions.q2}</label>
                                <textarea rows="3" value={a1} onChange={e => setA1(e.target.value)} placeholder="Tuliskan pemahamanmu (Misal: bunyi bergetar, butuh perantara...)" className="w-full p-3 rounded-xl border border-blue-500/40 bg-slate-900/60 text-blue-100 text-sm outline-none focus:border-cyan-400 resize-none"></textarea>
                            </div>

                            <div className="bg-cyan-950/40 p-5 rounded-2xl border border-cyan-500/30">
                                <label className="block text-sm md:text-base font-bold text-cyan-300 mb-3">{data.questions.q3}</label>
                                <textarea rows="2" value={a2} onChange={e => setA2(e.target.value)} placeholder="Aku berjanji akan menjaga pendengaranku dengan cara..." className="w-full p-3 rounded-xl border border-cyan-500/40 bg-slate-900/60 text-blue-100 text-sm outline-none focus:border-indigo-400 resize-none"></textarea>
                            </div>
                        </div>

                        <div className="mt-4 pt-4 border-t border-slate-700 flex flex-col items-center flex-shrink-0">
                            {feedbackMsg && <p className="text-rose-300 font-bold text-sm mb-3">{feedbackMsg}</p>}
                            <button onClick={handleFinish} className="bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-[0_0_15px_rgba(59,130,246,0.6)] uppercase tracking-widest font-concert">Mulai Penampilan!</button>
                        </div>
                    </div>
                </div>
            );
        }

        function EndScreen({ userData, correctCount, onRestart, playerName, playerSchool }) {
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState("idle"); 

            const handleSaveToGoogleSheets = async () => {
                if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("MASUKKAN_URL")) return setSaveStatus("error");
                setIsSaving(true);
                const payload = { nama: playerName, sekolah: playerSchool, skor: correctCount, benar: correctCount, ref1: "-", ref2: "-", ref3: "-", ref4: "-", papua_masalah: userData.final_project?.pemahaman || "-", papua_solusi: "-", papua_kampanye: userData.final_project ? `Janji Bintang: ${userData.final_project.aksi} | Rating Suka: ${userData.final_project.rating}` : "-" };
                try { await fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); setSaveStatus("success"); } catch (error) { setSaveStatus("error"); } finally { setIsSaving(false); }
            };

            return (
                <div className="flex flex-col items-center justify-center gap-6 animate-fade-in w-full flex-1 min-h-0 overflow-y-auto pb-10 pt-5">
                  <div className="text-center bg-slate-900/90 backdrop-blur-xl p-8 md:p-12 rounded-[3rem] shadow-[0_0_50px_rgba(59,130,246,0.4)] border border-blue-500/50 w-full max-w-3xl">
                    <h2 className="text-4xl md:text-6xl font-concert font-black text-cyan-400 text-glow tracking-widest">KONSER SUKSES!</h2>
                    <p className="text-xl md:text-3xl font-medium mt-4 text-blue-100">Bintang Utama {playerName}, <br/><span className="text-indigo-400 font-bold block mt-2 text-2xl md:text-4xl">Pakar Akustik Konser</span></p>
                    <div className="text-lg md:text-xl font-bold text-indigo-300/70 mt-8 bg-slate-950/60 p-6 rounded-[2rem] border border-slate-700 shadow-inner">
                        Total Frekuensi Tepat <br/><span className="text-6xl md:text-8xl text-cyan-400 inline-block mt-4 mb-2 drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]">{correctCount}</span><span className="text-3xl text-slate-600">/20</span>
                    </div>
                  </div>

                  <div className="w-full max-w-3xl bg-blue-950/60 p-8 rounded-[3rem] shadow-[0_0_30px_rgba(59,130,246,0.2)] border border-blue-500/40 text-center bg-slate-900/90 backdrop-blur-md">
                      <h3 className="font-concert font-black text-2xl md:text-4xl text-indigo-300 uppercase tracking-widest border-b border-blue-500/30 pb-4 mb-4">Sertifikat Musisi</h3>
                      <p className="text-cyan-300 font-bold text-lg md:text-xl">{playerName} - {playerSchool}</p>
                      <div className="mt-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700 text-blue-200 italic font-medium">
                          Janji Aksi: "{userData.ref5 || '-'}"
                      </div>
                  </div>

                  <div className="w-full max-w-3xl space-y-4">
                    {saveStatus === 'idle' && <button onClick={handleSaveToGoogleSheets} disabled={isSaving} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold w-full py-4 rounded-full text-lg shadow-[0_0_15px_rgba(59,130,246,0.4)] font-concert tracking-widest">{isSaving ? "Mengirim Laporan Konser..." : "Unggah Laporan ke Server Utama"}</button>}
                    {saveStatus === 'success' && <div className="bg-emerald-950/60 text-emerald-300 p-4 rounded-full text-center font-bold border border-emerald-500/50">Data Berhasil Diunggah! ✅</div>}
                    {saveStatus === 'error' && <div className="bg-rose-950/60 text-rose-300 p-4 rounded-full text-center font-bold border border-rose-500/50">Koneksi gagal. Pastikan sudah memasukkan URL Google Script. <button onClick={()=>setSaveStatus('idle')} className="underline">Coba lagi</button></div>}
                    <button onClick={onRestart} className="bg-slate-800 text-blue-200 font-bold w-full py-4 rounded-full border border-slate-600 font-concert tracking-widest hover:bg-slate-700 transition-colors">Keluar dari Panggung</button>
                  </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PetualanganKonser />);
    </script>
</body>
</html>
